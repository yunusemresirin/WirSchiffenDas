name: Build arc42 PDF

on:
  push:
    branches:
      - docs/arc42-latex
    paths:
      - 'docs/latex/**'
      - '.github/workflows/arc42-latex.yml'
  pull_request:
    paths:
      - 'docs/latex/**'
      - '.github/workflows/arc42-latex.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: architecture.tex
          working_directory: docs/latex
          latexmk_use_xelatex: false

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: WirSchiffenDas-arc42
          path: docs/latex/architecture.pdf
