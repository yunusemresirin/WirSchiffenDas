name: Build arc42 PDF

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: arc42-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build arc42 PDF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: architecture.tex
          working_directory: docs/latex
          latexmk_use_xelatex: false

      - name: Verify PDF exists
        run: test -s docs/latex/architecture.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: WirSchiffenDas-arc42-${{ github.sha }}
          path: docs/latex/architecture.pdf
          if-no-files-found: error
          retention-days: 30
