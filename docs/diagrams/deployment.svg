<text x="60" y="1136.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">1  Nginx → Configuration: /api/configurations</text>
<text x="60" y="1170.4" font-family="Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">2  Nginx → Analysis Management: /api/analyses</text>
