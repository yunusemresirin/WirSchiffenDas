<text x="60" y="1237.58" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">4  Management → Fluid; dann Fluid → Thermal → Electrical → Engine Management</text>
<text x="910" y="1135.58" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Alle Service-Aufrufe: HTTP / REST über Compose-DNS.</text>
<text x="910" y="1167.94" font-family="Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Callbacks: alle Analyse-Services → Management; Retry: Management → jeweiliger Service.</text>
<text x="910" y="1203.58" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Monitoring: Nginx → alle Backends über /monitor/&lt;service&gt;/…</text>
<text x="910" y="1237.58" font-family="Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start">Backend-Ports 8081–8086 zusätzlich 1:1 am Host veröffentlicht.</text>
<text x="60" y="1286.76" font-family="Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Spezifikation: docker-compose.yml · H2 ist eingebettet, kein separater Datenbank-Container.</text>
