server:
  port: 8082

spring:
  application:
    name: analysis-management-service
  datasource:
    url: jdbc:h2:file:./data/analysis-db
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

services:
  configuration:
    url: ${CONFIGURATION_SERVICE_URL:http://localhost:8081}
  fluid:
    url: ${FLUID_ANALYSIS_SERVICE_URL:http://localhost:8083}
  thermal:
    url: ${THERMAL_ANALYSIS_SERVICE_URL:http://localhost:8084}
  electrical:
    url: ${ELECTRICAL_ANALYSIS_SERVICE_URL:http://localhost:8085}
  engine-management:
    url: ${ENGINE_MANAGEMENT_ANALYSIS_SERVICE_URL:http://localhost:8086}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 2
        minimum-number-of-calls: 1
        permitted-number-of-calls-in-half-open-state: 1
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        event-consumer-buffer-size: 10
    instances:
      startFluid:
        base-config: default
      startThermal:
        base-config: default
      startElectrical:
        base-config: default
      startEngineManagement:
        base-config: default

http:
  client:
    connect-timeout: 2s
    read-timeout: 5s

analysis:
  timeout:
    inactivity: 30s
    scan-interval-ms: 1000

management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
