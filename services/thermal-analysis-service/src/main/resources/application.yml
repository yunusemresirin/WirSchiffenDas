server:
  port: 8084
spring:
  application:
    name: thermal-analysis-service
services:
  analysis-management:
    url: ${ANALYSIS_MANAGEMENT_SERVICE_URL:http://localhost:8082}
  next:
    url: ${ELECTRICAL_ANALYSIS_SERVICE_URL:http://localhost:8085}
resilience4j:
  circuitbreaker:
    instances:
      nextService:
        sliding-window-size: 2
        minimum-number-of-calls: 1
        permitted-number-of-calls-in-half-open-state: 1
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        event-consumer-buffer-size: 10
management:
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
http:
  client:
    connect-timeout: 2s
    read-timeout: 5s
worker:
  processing-delay: 2s
  callbacks:
    max-attempts: 3
    backoff: 200ms
  deduplication:
    capacity: 10000
    retention: 1h
