server:
  port: 8086
spring:
  application:
    name: engine-management-analysis-service
services:
  analysis-management:
    url: ${ANALYSIS_MANAGEMENT_SERVICE_URL:http://localhost:8082}
management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
http:
  client:
    connect-timeout: 2s
    read-timeout: 5s
worker:
  processing-delay: 2s
  callbacks:
    max-attempts: 3
    backoff: 200ms
  deduplication:
    capacity: 10000
    retention: 1h
